name: Build & Release NoxMedia APK

on:
  push:
    branches: [ "main", "master", "beta" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master", "beta" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release NoxMedia APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a637bba5ea280048a746436405b382007\n89330d32263010185419cf9370f86d9987821995\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne673007e224f43b6796140b2e7655a3637e00077\n560124443a64232fd5c0463c2a36b95043222f9c\n37060703ec501b5b9480abab071f4185797f742e\n248454f77223634280e6332427b23f3ec6e15b20" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Resolve Version Info
        id: versioning
        run: |
          IS_BETA="false"
          if [[ "${{ github.ref }}" == "refs/heads/beta" ]]; then
            IS_BETA="true"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # When you push a git tag like v2.0 or v3.1.5
            TAG_NAME="${{ github.ref_name }}"
            VER_NAME="${TAG_NAME#v}"
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "version_name=${VER_NAME}" >> $GITHUB_OUTPUT
            echo "release_title=NoxMedia ${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          elif [[ "$IS_BETA" == "true" ]]; then
            # Beta branch push: tags as v1.3.<run_number>-beta
            BASE_VER=$(grep -m1 'val baseVersion =' app/build.gradle.kts | cut -d '"' -f2 || echo "1.3")
            [ -z "$BASE_VER" ] && BASE_VER="1.3"
            FULL_VER="${BASE_VER}.${{ github.run_number }}-beta"
            echo "tag_name=v${FULL_VER}" >> $GITHUB_OUTPUT
            echo "version_name=${FULL_VER}" >> $GITHUB_OUTPUT
            echo "release_title=NoxMedia v${FULL_VER} (Beta)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          else
            # Continuous push on main/master: reads baseVersion from app/build.gradle.kts (e.g. 1.3)
            BASE_VER=$(grep -m1 'val baseVersion =' app/build.gradle.kts | cut -d '"' -f2 || echo "1.3")
            [ -z "$BASE_VER" ] && BASE_VER="1.3"
            FULL_VER="${BASE_VER}.${{ github.run_number }}"
            echo "tag_name=v${FULL_VER}" >> $GITHUB_OUTPUT
            echo "version_name=${FULL_VER}" >> $GITHUB_OUTPUT
            echo "release_title=NoxMedia v${FULL_VER}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Build All APKs
        run: ./gradlew assembleArm64Debug assembleArmv7Debug assembleUniversalDebug -PBUILD_NUMBER=${{ github.run_number }} -PVERSION_NAME=${{ steps.versioning.outputs.version_name }} --stacktrace --no-daemon

      - name: Prepare Output APKs
        run: |
          mkdir -p output
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk output/NoxMedia-arm64-v8a.apk
          cp app/build/outputs/apk/armv7/debug/app-armv7-debug.apk output/NoxMedia-armeabi-v7a.apk
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk output/NoxMedia-universal.apk
          ls -lh output/

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/beta' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: ${{ steps.versioning.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ### 🌟 What's New & Fixes in ${{ steps.versioning.outputs.release_title }}:

            • **⚡ Performance Optimizations**: Significantly optimized resource utilization, lower memory footprint, and faster catalog navigation, especially smooth on low-end and budget Android devices.
            • **🎬 Streaming Experience**: Enhanced byte-range chunk streaming pipeline for fluid, stutter-free playback on low-end hardware.
            • **🎯 Advanced Content Detection Overhaul**:
              - **Smart Year Detection**: Accurately recognizes and matches release years (e.g., distinguishing *Sherlock Holmes 2009* from other versions).
              - **Expanded Syntax Support**: Native parsing for `12x05`, `15x3`, `S01E02`, and continuous anime episode numbering.
              - **Symbol & Punctuation Cleanup**: Smart filtering of dividers, tags, and symbols (`;`, `'`, `-`, `•`, decorative brackets).
              - **Diacritics & Accents Normalization**: Converts international titles (e.g. `Shōgun` → `Shogun`, `Pokémon` → `Pokemon`) for 100% exact API match.
              - **Fix Metadata Candidate Preservation**: Preserves user-selected candidates directly via IMDb/TMDB find endpoints without overwriting manual selections with fuzzy search false positives.
              - **Cross-Card Stream Deduplication**: Identifies identical video streams across duplicate channels or mirror posts and eliminates phantom duplicate cards in the library.
            • **✨ Multi-Select in Unsupported Media**: Batch select unrecognized media files to quickly match, categorize, or manage in bulk.
            • **👁️ Hide / Unhide Gestures**: Long-press any media card to instantly hide or unhide content across your library.
            • **📊 Dead Entries Scan Progression**: Real-time progress percentage and visual progress bar while verifying deleted/broken Telegram messages.

            ---

            ### 📦 Direct APK Downloads for ${{ steps.versioning.outputs.release_title }}:

            • **NoxMedia-arm64-v8a.apk**: Recommended for Mid-range & High-end devices (Modern 64-bit architecture, ~35MB).
            • **NoxMedia-armeabi-v7a.apk**: Tailored for Low-end & Budget-friendly devices (Older 32-bit architecture, ~33MB).
            • **NoxMedia-universal.apk**: Universal build containing all CPU architectures (~65MB). Compatible with all devices, but larger. If you know your device architecture (32-bit or 64-bit), we strongly recommend choosing the specific arm64 or armeabi build above for the smoothest, most optimized experience.
          files: output/*.apk
          draft: false
          prerelease: ${{ steps.versioning.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.versioning.outputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
