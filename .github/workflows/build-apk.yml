name: Build & Release NoxMedia APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: "arm64"
            task: "assembleArm64Debug"
            apk_subpath: "arm64/debug/app-arm64-debug.apk"
            output_name: "NoxMedia-arm64-v8a.apk"
          - flavor: "armv7"
            task: "assembleArmv7Debug"
            apk_subpath: "armv7/debug/app-armv7-debug.apk"
            output_name: "NoxMedia-armeabi-v7a.apk"
          - flavor: "universal"
            task: "assembleUniversalDebug"
            apk_subpath: "universal/debug/app-universal-debug.apk"
            output_name: "NoxMedia-universal.apk"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a637bba5ea280048a746436405b382007\n89330d32263010185419cf9370f86d9987821995\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne673007e224f43b6796140b2e7655a3637e00077\n560124443a64232fd5c0463c2a36b95043222f9c\n37060703ec501b5b9480abab071f4185797f742e\n248454f77223634280e6332427b23f3ec6e15b20" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK (${{ matrix.flavor }})
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon

      - name: Prepare Output APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/${{ matrix.apk_subpath }} output/${{ matrix.output_name }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: output/${{ matrix.output_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish APKs to GitHub Releases
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: release-apks
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'NoxMedia Latest APK' }}
          body: |
            Direct APK downloads for NoxMedia Mobile Streamer engine:

            - 📱 **NoxMedia-arm64-v8a.apk**: Modern 64-bit Android devices (Recommended, ~35MB)
            - 📱 **NoxMedia-armeabi-v7a.apk**: Older & budget 32-bit Android devices (Compatible with older phones, ~33MB)
            - 📦 **NoxMedia-universal.apk**: Universal build (Contains all architectures, ~65MB)
          files: release-apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
