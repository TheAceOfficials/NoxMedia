name: Build & Release NoxMedia APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release NoxMedia APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a637bba5ea280048a746436405b382007\n89330d32263010185419cf9370f86d9987821995\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne673007e224f43b6796140b2e7655a3637e00077\n560124443a64232fd5c0463c2a36b95043222f9c\n37060703ec501b5b9480abab071f4185797f742e\n248454f77223634280e6332427b23f3ec6e15b20" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build All APKs
        run: ./gradlew assembleArm64Debug assembleArmv7Debug assembleUniversalDebug --stacktrace --no-daemon

      - name: Prepare Output APKs
        run: |
          mkdir -p output
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk output/NoxMedia-arm64-v8a.apk
          cp app/build/outputs/apk/armv7/debug/app-armv7-debug.apk output/NoxMedia-armeabi-v7a.apk
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk output/NoxMedia-universal.apk
          ls -lh output/

      - name: Clean up old 'latest' release and tag
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'NoxMedia Latest APK' }}
          target_commitish: ${{ github.sha }}
          body: |
            Direct APK downloads for NoxMedia Mobile Streamer engine:

            - 📱 **NoxMedia-arm64-v8a.apk**: Modern 64-bit Android devices (Recommended, ~35MB)
            - 📱 **NoxMedia-armeabi-v7a.apk**: Older & budget 32-bit Android devices (Compatible with older phones, ~33MB)
            - 📦 **NoxMedia-universal.apk**: Universal build (Contains all architectures, ~65MB)
          files: output/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
